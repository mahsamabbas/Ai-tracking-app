services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: techlio
      POSTGRES_PASSWORD: techlio
      POSTGRES_DB: techlio_activity
    ports:
      - "5432:5432"
    volumes:
      - ./infra/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./infra/sql/002_devices_projects_sessions.sql:/docker-entrypoint-initdb.d/002_devices_projects_sessions.sql
      - ./infra/sql/003_connector_provider.sql:/docker-entrypoint-initdb.d/003_connector_provider.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgres://techlio:techlio@postgres:5432/techlio_activity
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://techlio:techlio@postgres:5432/techlio_activity
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
      - api

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
